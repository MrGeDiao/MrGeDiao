<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="556" viewBox="0 0 1200 556" role="img" aria-label="现在还在做：santi、真活、realzoeus 三个私有项目，以及开源的 paper-reading-zh">
  <rect x="1" y="1" width="1198" height="554" fill="#F7F8F5" stroke="#D7DCE2" stroke-width="1.5"/>
  <rect x="1" y="1" width="1198" height="4" fill="#246BFD"/>

  <g font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', monospace" font-size="13" letter-spacing="0.7" fill="#246BFD">
    <text x="42" y="42">ID</text>
    <text x="112" y="42">PROJECT</text>
    <text x="312" y="42">PURPOSE</text>
    <text x="602" y="42">METHOD</text>
    <text x="892" y="42">BOUNDARY</text>
  </g>
  <line x1="40" y1="58" x2="1160" y2="58" stroke="#AEB5BF"/>
  <g stroke="#D7DCE2">
    <line x1="100" y1="58" x2="100" y2="530"/>
    <line x1="300" y1="58" x2="300" y2="530"/>
    <line x1="590" y1="58" x2="590" y2="530"/>
    <line x1="880" y1="58" x2="880" y2="530"/>
    <line x1="40" y1="176" x2="1160" y2="176"/>
    <line x1="40" y1="294" x2="1160" y2="294"/>
    <line x1="40" y1="412" x2="1160" y2="412"/>
  </g>
  <line x1="40" y1="530" x2="1160" y2="530" stroke="#AEB5BF"/>

  <g font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', monospace" fill="#246BFD" font-size="30" font-weight="650">
    <text x="42" y="128">01</text><text x="42" y="246">02</text><text x="42" y="364">03</text><text x="42" y="482">04</text>
  </g>
  <g font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', monospace" fill="#101318" font-size="17" font-weight="700">
    <text x="112" y="110">santi</text>
    <text x="112" y="228">zhenhuo</text>
    <text x="112" y="346">realzoeus</text>
    <text x="112" y="464">paper-reading-zh</text>
  </g>
  <g font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', monospace" font-size="14" fill="#246BFD">
    <text x="112" y="138">多模型协作</text><text x="112" y="256">真活 · 模型实测</text><text x="112" y="374">X 编辑台</text><text x="112" y="492">开源 · 论文精读</text>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Segoe UI', sans-serif" font-size="18" fill="#101318">
    <text x="312" y="91">Opus 只做判断，</text><text x="312" y="120">Codex、DeepSeek、Grok、Agy</text><text x="312" y="149">当 worker，按任务挑模型。</text>
    <text x="602" y="91">每个写入 job 一个 worktree；</text><text x="602" y="120">审查必须跨模型家族；</text><text x="602" y="149">逐次核验实际用了哪个模型。</text>
    <text x="892" y="91">agent 一致不算数，</text><text x="892" y="120">测试说了算；模型家族</text><text x="892" y="149">不对的 pass 不计入签发。</text>
    <text x="312" y="209">新模型发布当天，</text><text x="312" y="238">用固定的真实任务测正确率、</text><text x="312" y="267">速度和每题成本。</text>
    <text x="602" y="209">隐藏测试判代码题，</text><text x="602" y="238">程序检查改写的事实；</text><text x="602" y="267">6 道修 bug 题取自真实修复。</text>
    <text x="892" y="209">不做综合排行榜；</text><text x="892" y="238">题目和 KEY 不公开，</text><text x="892" y="267">公开结果时附原始输出。</text>
    <text x="312" y="327">维护 @realzoeus 的编辑台：</text><text x="312" y="356">帖子我自己写，Claude 当</text><text x="312" y="385">编辑和研究助理。</text>
    <text x="602" y="327">定时脚本只读 X，</text><text x="602" y="356">把热帖、提及和数据推到飞书，</text><text x="602" y="385">附备选回复草稿。</text>
    <text x="892" y="327">不替我发帖、回帖、点赞、</text><text x="892" y="356">关注、私信；</text><text x="892" y="385">发不发都由我决定。</text>
    <text x="312" y="445">给 AI 读论文立证据规则，</text><text x="312" y="474">支持 Codex、Claude Code</text><text x="312" y="503">和网页端项目。</text>
    <text x="602" y="445">没核验的写「未核验」；</text><text x="602" y="474">实验数字锚定原文</text><text x="602" y="503">Table / Figure 或段落。</text>
    <text x="892" y="445">读不到的不编；</text><text x="892" y="474">比较多篇论文前</text><text x="892" y="503">先对齐数据集和指标。</text>
  </g>
</svg>
