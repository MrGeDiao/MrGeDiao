  <g font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', monospace" fill="#101318" font-size="15" font-weight="700">
    <text x="112" y="121">santi</text>
    <text x="112" y="209">zhenhuo</text>
    <text x="112" y="297">realzoeus</text>
    <text x="112" y="385">paper-reading-zh</text>
  </g>
  <g font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', monospace" font-size="10.5" fill="#246BFD">
    <text x="112" y="146">多模型协作</text><text x="112" y="234">真活 · 模型实测</text><text x="112" y="322">X 编辑台</text><text x="112" y="410">开源 · 论文精读</text>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Segoe UI', sans-serif" font-size="13.7" fill="#101318">
    <text x="322" y="119">Opus 只做判断，Codex、DeepSeek、</text><text x="322" y="143">Grok、Agy 当 worker，按任务挑模型。</text>
    <text x="622" y="119">每个写入 job 一个 worktree；审查必须跨</text><text x="622" y="143">模型家族；逐次核验实际用了哪个模型。</text>
    <text x="922" y="119">agent 一致不算数，测试说了算；</text><text x="922" y="143">模型家族不对的 pass 不计入签发。</text>

    <text x="322" y="207">新模型发布当天，用固定的真实任务</text><text x="322" y="231">测正确率、速度和每题成本。</text>
    <text x="622" y="207">隐藏测试判代码题，程序查改写事实；</text><text x="622" y="231">6 道修 bug 题取自真实修复提交。</text>
    <text x="922" y="207">不做综合排行榜；题目和 KEY</text><text x="922" y="231">不公开，公开结果时附原始输出。</text>

    <text x="322" y="295">维护 @realzoeus 的编辑台：帖子</text><text x="322" y="319">我自己写，Claude 当编辑和研究助理。</text>
    <text x="622" y="295">定时脚本只读 X，把热帖、提及和数据</text><text x="622" y="319">推到飞书，附备选回复草稿。</text>
    <text x="922" y="295">不替我发帖、回帖、点赞、关注、</text><text x="922" y="319">私信；发不发都由我决定。</text>

    <text x="322" y="383">给 AI 读论文立证据规则，</text><text x="322" y="407">支持 Codex、Claude Code 和网页端项目。</text>
    <text x="622" y="383">没核验的写「未核验」；实验数字</text><text x="622" y="407">锚定原文 Table / Figure 或段落。</text>
    <text x="922" y="383">读不到的不编；比较多篇论文</text><text x="922" y="407">前先对齐数据集和指标。</text>
  </g>
