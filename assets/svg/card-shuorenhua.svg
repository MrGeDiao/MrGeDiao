<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="130" viewBox="0 0 1200 130" role="img" aria-label="shuorenhua · 说人话">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f18" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="card-border-hover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
      <animate attributeName="x1" values="0%;200%;0%" dur="3s" repeatCount="indefinite" />
      <animate attributeName="x2" values="100%;-100%;100%" dur="3s" repeatCount="indefinite" />
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Vector Icon for Shuorenhua (Language/AI Node) -->
    <g id="icon-shuorenhua">
      <rect x="0" y="0" width="80" height="80" rx="20" fill="#0f172a" stroke="url(#card-border)" stroke-width="2" />
      <path d="M 25 30 C 35 30, 45 40, 55 30" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
      <path d="M 25 40 C 35 40, 45 50, 55 40" fill="none" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/>
      <path d="M 25 50 C 35 50, 45 60, 55 50" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
      <circle cx="25" cy="30" r="3" fill="#ffffff" />
      <circle cx="55" cy="50" r="3" fill="#ffffff" />

      <!-- Pulsing Node -->
      <circle cx="40" cy="45" r="4" fill="#c084fc" filter="url(#glow)">
        <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" />
      </circle>
    </g>
  </defs>

  <style>
    .card-rect {
      fill: url(#card-bg);
      stroke: url(#card-border);
      stroke-width: 1.5;
      transition: all 0.3s ease;
      rx: 16px;
    }
    .wrapper:hover .card-rect {
      stroke: url(#card-border-hover);
      stroke-width: 2.5;
      filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.4));
    }
    .title {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 32px;
      font-weight: 700;
      fill: #f8fafc;
      transition: fill 0.3s ease;
    }
    .wrapper:hover .title {
      fill: #38bdf8;
    }
    .desc {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 18px;
      fill: #94a3b8;
      line-height: 1.5;
      letter-spacing: 0.5px;
    }
    .stats {
      font-family: "SF Mono", ui-monospace, monospace;
      font-size: 15px;
      fill: #64748b;
      font-weight: 500;
    }
    .star {
      fill: #eab308;
    }
  </style>

  <g class="wrapper">
    <!-- Base Card -->
    <rect class="card-rect" x="2" y="2" width="1196" height="126" />

    <!-- Icon -->
    <use href="#icon-shuorenhua" x="40" y="25" />

    <!-- Content -->
    <g transform="translate(150, 52)">
      <text x="0" y="0" class="title">shuorenhua · 说人话</text>

      <!-- Stats -->
      <g transform="translate(320, -5)">
        <path class="star" d="M8 0L10.4 5.3L16 6L11.8 10L13 16L8 13L3 16L4.2 10L0 6L5.6 5.3L8 0Z" transform="translate(0, -11)" />
        <text x="22" y="3" class="stats">Star · MIT License</text>
      </g>

      <text x="0" y="42" class="desc">中文优先的「去 AI 味」改写 skill</text>
    </g>

    <!-- Animated Hover Arrow -->
    <g transform="translate(1120, 65)" opacity="0" class="arrow" style="transition: all 0.3s ease;">
      <path d="M0 -10 L10 0 L0 10" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <style>
      .wrapper:hover .arrow {
        opacity: 1;
        transform: translate(1140px, 65px);
      }
    </style>
  </g>
</svg>
