<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="MrGeDiao Signature">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f18" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
      <animate attributeName="x1" values="0%;-100%;0%" dur="8s" repeatCount="indefinite" />
      <animate attributeName="x2" values="100%;0%;100%" dur="8s" repeatCount="indefinite" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .card-rect {
      fill: url(#card-bg);
      stroke: url(#card-border);
      stroke-width: 1.5;
      rx: 16px;
    }
    .signature {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 4px;
      fill: url(#text-grad);
      font-style: italic;
    }
    .signature-fg {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 4px;
      fill: #e2e8f0;
      font-style: italic;
    }
    .mail {
      font-family: "SF Mono", ui-monospace, monospace;
      font-size: 14px;
      fill: #64748b;
      letter-spacing: 1px;
    }
    .line {
      stroke: #1e293b;
      stroke-width: 1;
    }
  </style>

  <!-- Cohesive deep-space background card -->
  <rect class="card-rect" x="2" y="2" width="1196" height="146" />

  <line x1="100" y1="50" x2="1100" y2="50" class="line" />

  <g transform="translate(600, 90)" text-anchor="middle">
    <!-- Luminous background glow -->
    <text x="0" y="0" class="signature" filter="url(#glow)" opacity="0.5">MrGeDiao</text>
    <!-- Crisp readable foreground -->
    <text x="0" y="0" class="signature-fg">MrGeDiao</text>
    <text x="0" y="25" class="mail">zcoeus@protonmail.com</text>
  </g>
</svg>
