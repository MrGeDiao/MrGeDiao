<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="MrGeDiao，产品经理出身的全栈工程师，专注 AI 工具、Agent 与中文 AI 体验">
  <defs>
    <linearGradient id="banner-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#0B1120"/>
    </linearGradient>
    <clipPath id="banner-clip">
      <rect x="0" y="0" width="1200" height="320" rx="24"/>
    </clipPath>
    <radialGradient id="banner-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#0EA5E9" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="banner-glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="banner-gridfade" cx="0.60" cy="0.42" r="0.72">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.65" stop-color="#888888"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <mask id="banner-gridmask" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="320">
      <rect x="0" y="0" width="1200" height="320" fill="url(#banner-gridfade)"/>
    </mask>
    <pattern id="banner-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 H 0 V 32" fill="none" stroke="#334155" stroke-width="1" opacity="0.2"/>
    </pattern>
    <linearGradient id="banner-stroke" x1="500" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity="0.35"/>
      <stop offset="0.12" stop-color="#0EA5E9" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="banner-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="banner-blur-soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- 卡片底 -->
  <rect width="1200" height="320" rx="24" fill="url(#banner-bg)"/>

  <g clip-path="url(#banner-clip)">
    <!-- 网格纹理，向边缘渐隐 -->
    <rect x="0" y="0" width="1200" height="320" fill="url(#banner-grid)" mask="url(#banner-gridmask)"/>

    <!-- 主光晕 -->
    <ellipse cx="880" cy="118" rx="310" ry="180" fill="url(#banner-glow)">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="10s" repeatCount="indefinite"/>
    </ellipse>
    <!-- 次级光晕（右下节点） -->
    <circle cx="1116" cy="212" r="90" fill="url(#banner-glow2)">
      <animate attributeName="opacity" values="1;0.6;1" dur="8s" repeatCount="indefinite"/>
    </circle>

    <!-- 次级暗线 -->
    <path id="banner-path2" d="M 540 292 C 740 292 790 152 936 144 C 1066 138 1090 252 1220 246"
          fill="none" stroke="#06B6D4" stroke-width="1" opacity="0.22">
      <animate attributeName="opacity" values="0.16;0.3;0.16" dur="8s" repeatCount="indefinite"/>
    </path>

    <!-- 主路径：辉光层 + 实线层 -->
    <path d="M 500 262 C 690 262 724 96 884 96 C 1006 96 1014 212 1116 212 C 1166 212 1186 178 1220 148"
          fill="none" stroke="url(#banner-stroke)" stroke-width="5" opacity="0.30" filter="url(#banner-blur)"/>
    <path id="banner-path1" d="M 500 262 C 690 262 724 96 884 96 C 1006 96 1014 212 1116 212 C 1166 212 1186 178 1220 148"
          fill="none" stroke="url(#banner-stroke)" stroke-width="1.5" opacity="0.9"/>

    <!-- 发光节点 -->
    <g>
      <circle cx="884" cy="96" r="9" fill="none" stroke="#0EA5E9" stroke-width="1" opacity="0.35">
        <animate attributeName="opacity" values="0.2;0.5;0.2" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="884" cy="96" r="3" fill="#38BDF8"/>
    </g>
    <g>
      <circle cx="1116" cy="212" r="7" fill="none" stroke="#0EA5E9" stroke-width="1" opacity="0.3">
        <animate attributeName="opacity" values="0.45;0.18;0.45" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1116" cy="212" r="2.5" fill="#38BDF8"/>
    </g>

    <!-- 光点沿路径漂移：相对路径，静帧落在路径起点 -->
    <g transform="translate(500,262)">
      <circle r="6" fill="#0EA5E9" opacity="0.35" filter="url(#banner-blur-soft)">
        <animateMotion dur="9s" repeatCount="indefinite"
          path="m 0 0 c 190 0 224 -166 384 -166 c 122 0 130 116 232 116 c 50 0 70 -34 104 -64"/>
      </circle>
      <circle r="2.2" fill="#38BDF8">
        <animateMotion dur="9s" repeatCount="indefinite"
          path="m 0 0 c 190 0 224 -166 384 -166 c 122 0 130 116 232 116 c 50 0 70 -34 104 -64"/>
      </circle>
    </g>
  </g>

  <!-- 文案 -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="84" y="140" font-size="60" font-weight="700" fill="#F8FAFC">MrGeDiao</text>
    <text x="84" y="188" font-size="22" fill="#94A3B8">产品经理出身的全栈工程师</text>
    <text x="84" y="224" font-size="15" fill="#64748B">AI 工具 · Agent · 中文 AI 体验</text>
  </g>

  <!-- 描边收边 -->
  <rect x="0.5" y="0.5" width="1199" height="319" rx="23.5" fill="none" stroke="#1E293B" stroke-width="1"/>
</svg>
