<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="MrGeDiao - 产品经理出身的全栈工程师">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070a" />
      <stop offset="50%" stop-color="#0a0f18" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-purple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Moving gradient for text -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="75%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
      <animate attributeName="x1" from="0%" to="-200%" dur="8s" repeatCount="indefinite" />
      <animate attributeName="x2" from="200%" to="0%" dur="8s" repeatCount="indefinite" />
    </linearGradient>

    <linearGradient id="subtitle-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 80px;
      font-weight: 800;
      letter-spacing: -2px;
      fill: url(#text-grad);
    }
    .subtitle {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 26px;
      font-weight: 500;
      fill: url(#subtitle-grad);
      letter-spacing: 2px;
    }
    .tagline {
      font-family: "SF Mono", ui-monospace, Menlo, Monaco, monospace;
      font-size: 14px;
      font-weight: 600;
      fill: #38bdf8;
      letter-spacing: 1px;
    }

    .particle {
      animation: float 15s infinite linear;
    }
    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); opacity: 0; }
      10% { opacity: 0.8; }
      90% { opacity: 0.8; }
      100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
    }

    .wave {
      animation: waveMove 10s infinite linear;
    }
    @keyframes waveMove {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 1200; }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bg-grad)" />
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Animated Glowing Orbs Background -->
  <circle cx="200" cy="180" r="150" fill="#c084fc" opacity="0.15" filter="url(#glow-purple)">
    <animate attributeName="cx" values="200; 250; 150; 200" dur="20s" repeatCount="indefinite" />
    <animate attributeName="cy" values="180; 120; 220; 180" dur="25s" repeatCount="indefinite" />
  </circle>
  <circle cx="1000" cy="180" r="180" fill="#38bdf8" opacity="0.15" filter="url(#glow-purple)">
    <animate attributeName="cx" values="1000; 950; 1050; 1000" dur="22s" repeatCount="indefinite" />
    <animate attributeName="cy" values="180; 240; 140; 180" dur="18s" repeatCount="indefinite" />
  </circle>

  <!-- Abstract Animated Lines -->
  <g opacity="0.3">
    <path d="M0,280 C300,200 600,350 1200,280" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="10 20" class="wave" />
    <path d="M0,320 C400,380 800,200 1200,320" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="5 15" class="wave" style="animation-duration: 15s; animation-direction: reverse;" />
  </g>

  <!-- Content Group -->
  <g transform="translate(100, 160)">
    <!-- Tech Frame/Border Decoration -->
    <path d="M -40,-80 L -20,-80 M -40,-80 L -40,-60" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
    <path d="M -40,120 L -20,120 M -40,120 L -40,100" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.6"/>

    <text x="0" y="0" class="title" filter="url(#glow-cyan)">MrGeDiao</text>
    <text x="0" y="0" class="title">MrGeDiao</text>

    <text x="4" y="45" class="subtitle">产品经理出身的全栈工程师</text>

    <!-- Tagline pills -->
    <g transform="translate(4, 85)">
      <rect x="0" y="-14" width="70" height="24" rx="12" fill="#0369A1" opacity="0.2" stroke="#38bdf8" stroke-width="1" />
      <text x="35" y="3" class="tagline" text-anchor="middle">AI 工具</text>

      <rect x="85" y="-14" width="60" height="24" rx="12" fill="#0369A1" opacity="0.2" stroke="#38bdf8" stroke-width="1" />
      <text x="115" y="3" class="tagline" text-anchor="middle">Agent</text>

      <rect x="160" y="-14" width="110" height="24" rx="12" fill="#0369A1" opacity="0.2" stroke="#38bdf8" stroke-width="1" />
      <text x="215" y="3" class="tagline" text-anchor="middle">中文 AI 体验</text>
    </g>
  </g>

  <!-- Decorative Particles -->
  <g fill="#ffffff" opacity="0">
    <circle cx="800" cy="300" r="1.5" class="particle" style="animation-duration: 8s; animation-delay: 0s;" />
    <circle cx="900" cy="280" r="2" class="particle" style="animation-duration: 12s; animation-delay: 2s;" />
    <circle cx="1050" cy="320" r="1" class="particle" style="animation-duration: 10s; animation-delay: 4s;" />
    <circle cx="700" cy="250" r="1.5" class="particle" style="animation-duration: 9s; animation-delay: 6s;" />
    <circle cx="1150" cy="290" r="2.5" class="particle" style="animation-duration: 14s; animation-delay: 1s;" />
  </g>
</svg>
