  <rect x="0.5" y="0.5" width="1199" height="279" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Top hairline rule -->
  <line x1="84" y1="54.5" x2="1116" y2="54.5" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Masthead -->
  <text x="84" y="131" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="56" font-weight="700" fill="#0F172A">MrGeDiao</text>

  <!-- Single accent detail: short bar under the name -->
