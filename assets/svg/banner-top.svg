  <text x="1116" y="259" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="400" fill="#64748B">AI 工具 · Agent · 中文 AI 体验</text>
