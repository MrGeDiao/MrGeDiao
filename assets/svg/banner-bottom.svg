<svg width="1200" height="120" viewBox="0 0 1200 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MrGeDiao 页尾收尾条">
  <defs>
    <linearGradient id="bbtm-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="bbtm-path" x1="200" y1="0" x2="1150" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity="0"/>
      <stop offset="0.28" stop-color="#0EA5E9" stop-opacity="0.55"/>
      <stop offset="0.58" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="0.85" stop-color="#06B6D4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bbtm-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.26"/>
      <stop offset="0.5" stop-color="#0EA5E9" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="bbtm-clip">
      <rect x="0" y="0" width="1200" height="120" rx="20"/>
    </clipPath>
  </defs>

  <!-- 卡片底 -->
  <rect x="0.5" y="0.5" width="1199" height="119" rx="20" fill="url(#bbtm-bg)"/>

  <g clip-path="url(#bbtm-clip)">
    <!-- 收尾光路：一条贝塞尔光线，向右缓缓淡出 -->
    <ellipse cx="700" cy="62" rx="300" ry="46" fill="url(#bbtm-glow)">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="10s" repeatCount="indefinite"/>
    </ellipse>
    <path d="M 208 64 C 380 64, 460 50, 640 58 S 940 74, 1148 60"
          stroke="url(#bbtm-path)" stroke-width="1.5" stroke-linecap="round"/>
    <!-- 光路上的节点 -->
    <circle cx="700" cy="60.6" r="2.5" fill="#38BDF8">
      <animate attributeName="opacity" values="0.65;1;0.65" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- wordmark -->
  <text x="64" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="17" letter-spacing="0.1em" fill="#94A3B8">MrGeDiao</text>

  <!-- 描边收边 -->
  <rect x="0.5" y="0.5" width="1199" height="119" rx="20" fill="none" stroke="#1E293B"/>
</svg>
