<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="130" viewBox="0 0 1200 130" role="img" aria-label="paper-reading-zh · AI 精读中文论文的证据规则包">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f18" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="card-border-hover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
      <animate attributeName="x1" values="0%;200%;0%" dur="3s" repeatCount="indefinite" />
      <animate attributeName="x2" values="100%;-100%;100%" dur="3s" repeatCount="indefinite" />
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Vector Icon for paper-reading-zh (Document/Analysis Node) -->
    <g id="icon-paper">
      <rect x="0" y="0" width="80" height="80" rx="20" fill="#0f172a" stroke="url(#card-border)" stroke-width="2" />

      <!-- Document Outline -->
      <path d="M 25 20 L 45 20 L 55 30 L 55 60 L 25 60 Z" fill="none" stroke="#c084fc" stroke-width="3" stroke-linejoin="round"/>
      <!-- Fold -->
      <path d="M 45 20 L 45 30 L 55 30" fill="none" stroke="#c084fc" stroke-width="3" stroke-linejoin="round"/>

      <!-- Scanning/Reading Line -->
      <line x1="20" y1="35" x2="60" y2="35" stroke="#38bdf8" stroke-width="2" filter="url(#glow)">
        <animate attributeName="y1" values="35; 50; 35" dur="3s" repeatCount="indefinite" />
        <animate attributeName="y2" values="35; 50; 35" dur="3s" repeatCount="indefinite" />
      </line>

      <!-- Data Points -->
      <circle cx="35" cy="45" r="2" fill="#ffffff" />
      <circle cx="45" cy="50" r="2" fill="#ffffff" />
    </g>
  </defs>

  <style>
    .card-rect {
      fill: url(#card-bg);
      stroke: url(#card-border);
      stroke-width: 1.5;
      transition: all 0.3s ease;
      rx: 16px;
    }
    .wrapper:hover .card-rect {
      stroke: url(#card-border-hover);
      stroke-width: 2.5;
      filter: drop-shadow(0 0 12px rgba(192, 132, 252, 0.4));
    }
    .title {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 32px;
      font-weight: 700;
      fill: #f8fafc;
      transition: fill 0.3s ease;
    }
    .wrapper:hover .title {
      fill: #c084fc;
    }
    .desc {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 18px;
      fill: #94a3b8;
      line-height: 1.5;
      letter-spacing: 0.5px;
    }
    .stats {
      font-family: "SF Mono", ui-monospace, monospace;
      font-size: 15px;
      fill: #64748b;
      font-weight: 500;
    }
    .star {
      fill: #eab308;
    }
  </style>

  <g class="wrapper">
    <!-- Base Card -->
    <rect class="card-rect" x="2" y="2" width="1196" height="126" />

    <!-- Icon -->
    <use href="#icon-paper" x="40" y="25" />

    <!-- Content -->
    <g transform="translate(150, 52)">
      <text x="0" y="0" class="title">paper-reading-zh</text>

      <!-- Stats -->
      <g transform="translate(280, -5)">
        <path class="star" d="M8 0L10.4 5.3L16 6L11.8 10L13 16L8 13L3 16L4.2 10L0 6L5.6 5.3L8 0Z" transform="translate(0, -11)" />
        <text x="22" y="3" class="stats">Star · MIT License</text>
      </g>

      <text x="0" y="42" class="desc">AI 精读中文论文的证据规则包</text>
    </g>

    <!-- Animated Hover Arrow -->
    <g transform="translate(1120, 65)" opacity="0" class="arrow" style="transition: all 0.3s ease;">
      <path d="M0 -10 L10 0 L0 10" fill="none" stroke="#c084fc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <style>
      .wrapper:hover .arrow {
        opacity: 1;
        transform: translate(1140px, 65px);
      }
    </style>
  </g>
</svg>
